name: Lab Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run all 28 experiments
        run: |
          set -u
          ok=0; total=0; failed=0
          for f in experiments/*.c; do
            base=$(basename "$f" .c)
            total=$((total+1))
            echo "==================================================="
            echo "▶ Compiling: $base"
            echo "==================================================="
            if grep -q "sqrt" "$f"; then
              gcc -w -o "/tmp/prog_$base" "$f" -lm || { echo "❌ COMPILE FAILED: $base"; failed=$((failed+1)); continue; }
            else
              gcc -w -o "/tmp/prog_$base" "$f" || { echo "❌ COMPILE FAILED: $base"; failed=$((failed+1)); continue; }
            fi
            echo "▶ Running with sample input:"
            echo "---------------------------------------------------"
            if [ -f "experiments/inputs/$base.txt" ]; then
              echo "$ base input:"
              cat "experiments/inputs/$base.txt"
              echo "▶ Output:"
              "/tmp/prog_$base" < "experiments/inputs/$base.txt" || { echo "⚠ runtime issue"; }
            else
              echo "$ (no input required)"
              echo "▶ Output:"
              "/tmp/prog_$base" || { echo "⚠ runtime issue"; }
            fi
            echo "---------------------------------------------------"
            ok=$((ok+1))
            echo ""
          done
          echo ""
          echo "✔ Compiled & ran $ok/$total experiments"
          if [ "$failed" -gt 0 ]; then
            echo "✘ $failed compile failures"
            exit 1
          fi
